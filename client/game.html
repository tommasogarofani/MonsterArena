<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Arena</title>

    <!--This is the font import pls don't delete-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <script src="js/game.js"></script>
</head>

<body>
    <div class="game_space">

        <div class="charsheet player">
            <div class="name_container">
                <h1 class="name player font_1">Svalvolas</h1>
            </div>
            
            <div class="attribute_container">
                <div class="attribute player">
                    <meter class="health_bar" value="100" min="0" max="100"></meter>
                    <p class="label font_1">Health</p>
                </div>

                <div class="attribute player">
                    <meter value="100" min="0" max="60"></meter>
                    <p class="label font_1">Mana</p>
                </div>
            </div>

            <div class="action_container player">
                <button class="font_1">Fendente</button>
                <button class="font_1">Malocchio</button>
                <button class="font_1">Benedizione</button>
            </div>

            <div class="message_container">
                <p class="message font_1">"Svalvolas hits for <span>12</span> damage."</p>
            </div>
        </div>

        <div class="charsheet monster">
            <div class="name_container monster">
                <h1 class="name monster font_1">Gobelandro</h1>
            </div>
            
            <div class="attribute_container monster">
                <div class="attribute monster">
                    <meter class="health_bar" value="100" min="0" max="100"></meter>
                    <p class="label font_1">Health</p>
                </div>

                <div class="attribute monster">
                    <meter value="100" min="0" max="60"></meter>
                    <p class="label font_1">Mana</p>
                </div>
            </div>

            <div class="message_container monster">
                <p class="message font_1">"Gobelandro hits for <span>7</span> damage."</p>
            </div>
        </div>
        
    </div>

</body>

</html>

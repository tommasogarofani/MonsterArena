<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Arena</title>

    <link rel="stylesheet" href="./css/style.css">

    <script src="js/game.js"></script>
</head>

<body>
    <div class="container">

        <div id="player">
            <p>Nome giocatore:</p>

            <div class="attribute">
                <meter value="100" min="0" max="100"></meter>
                <p>Salute</p>
            </div>

            <div class="attribute">
                <meter value="100" min="0" max="100"></meter>
                <p>Mana</p>
            </div>
        </div>

        <div id="monster">
            <p>Nome mostro:</p>

            <div class="attribute">
                <meter value="100" min="0" max="100"></meter>
                <p>Salute</p>
            </div>

            <div class="attribute">
                <meter value="100" min="0" max="100"></meter>
                <p>Mana</p>
            </div>
        </div>

    </div>

</body>

</html>
